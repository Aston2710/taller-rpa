[project]
name = "taller-rpa"
version = "0.1.0"
description = "Default template for PDM package"
authors = [
    {name = "jredondo",email = "jredondo@mayoreo.biz"},
]
dependencies = ["pandas>=3.0.5", "python-dotenv>=1.2.2", "pydantic>=2.13.4", "loguru>=0.7.3", "openpyxl>=3.1.5", "email-validator>=2.3.0"]
requires-python = ">=3.13"
readme = "README.md"
license = {text = "MIT"}

[project.scripts]
taller-rpa = "taller_rpa.main:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"


[tool.pdm]
distribution = true

[tool.pdm.scripts]
main = "python -m taller_rpa.main"
bot = "python -m taller_rpa.main"
test = "pytest -q"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
